name: Build and Test (Production Grade)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-core:
    name: Build Core (No Graphics)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        cxx_standard: [20]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install build dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build g++-12 build-essential pkg-config
        update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
        update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100

    - name: Install build dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake ninja

    - name: Install build dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install cmake ninja -y

    - name: Create build directory
      run: cmake -E make_directory build

    - name: Configure CMake (Release, No Graphics)
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRPG_ENABLE_GRAPHICS=OFF -DRPG_ENABLE_PHYSICS=OFF -DRPG_BUILD_TESTS=ON -DRPG_BUILD_GAME=ON

    - name: Build
      run: cmake --build build --config Release -j4

    - name: Run unit tests
      run: |
        cd build
        ctest --output-on-failure -C Release

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: game-build-${{ matrix.os }}
        path: build/bin/
        retention-days: 30
